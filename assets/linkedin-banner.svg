<svg width="1584" height="396" viewBox="0 0 1584 396" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep Cosmic Background -->
  <rect width="1584" height="396" fill="url(#linkedin-bg)"/>

  <defs>
    <linearGradient id="linkedin-bg" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060813"/>
      <stop offset="50%" stop-color="#0c1026"/>
      <stop offset="100%" stop-color="#080918"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-pattern" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Ambient Glows -->
  <circle cx="1350" cy="120" r="260" fill="url(#cyan-glow)"/>
  <circle cx="900" cy="300" r="220" fill="url(#purple-glow)"/>

  <!-- Grid Pattern -->
  <rect width="1584" height="396" fill="url(#grid-pattern)"/>

  <!-- Border Line Top and Bottom -->
  <line x1="0" y1="1" x2="1584" y2="1" stroke="rgba(99, 102, 241, 0.3)" stroke-width="2"/>
  <line x1="0" y1="395" x2="1584" y2="395" stroke="rgba(6, 182, 212, 0.3)" stroke-width="2"/>

  <!-- Right Content Container (leaves bottom-left clear for avatar) -->
  <g transform="translate(420, 65)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="460" height="32" rx="16" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#10b981"/>
    <text x="36" y="21" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SOVEREIGN SYSTEMS ARCHITECTURE • MADEIRA, PORTUGAL 🇵🇹</text>

    <!-- Name Title -->
    <text x="0" y="95" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">JEAN CARLO FERREIRA</text>

    <!-- Subtitle -->
    <text x="0" y="140" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="0.5">Principal Systems Architect &amp; Lead AI Engineer</text>
    <text x="0" y="170" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">17+ Years Systems Leadership • UNERG 2007 • Cloud-Native GCP/AWS • 23 Production Repos</text>

    <!-- Technical Badges Row -->
    <g transform="translate(0, 195)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="220" height="38" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="14" y="24" fill="#c7d2fe" font-family="monospace" font-size="12" font-weight="600">⚡ 23 PRODUCTION REPOS</text>

      <!-- Badge 2 -->
      <rect x="230" y="0" width="220" height="38" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="244" y="24" fill="#67e8f9" font-family="monospace" font-size="12" font-weight="600">🤖 AGENT EVALS &amp; SAFETY</text>

      <!-- Badge 3 -->
      <rect x="460" y="0" width="220" height="38" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="474" y="24" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="600">⏱️ SUB-150µs SIMD QUANT</text>

      <!-- Badge 4 -->
      <rect x="690" y="0" width="220" height="38" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="704" y="24" fill="#34d399" font-family="monospace" font-size="12" font-weight="600">☁️ GCP LAKEHOUSE / IAC</text>
    </g>

    <!-- Bottom URL Link -->
    <g transform="translate(0, 252)">
      <text x="0" y="16" fill="#64748b" font-family="monospace" font-size="13" font-weight="600">PORTFOLIO:</text>
      <text x="95" y="16" fill="#06b6d4" font-family="monospace" font-size="13" font-weight="700">https://omniversodigital.github.io</text>
      <text x="420" y="16" fill="#64748b" font-family="monospace" font-size="13" font-weight="600">GITHUB:</text>
      <text x="485" y="16" fill="#818cf8" font-family="monospace" font-size="13" font-weight="700">github.com/omniversodigital</text>
    </g>
  </g>
</svg>
